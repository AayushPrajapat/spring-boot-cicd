name: Spring Boot CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Check Java Version
        run: java -version

      - name: Build Project
        run: mvn clean install

      - name: Run Tests
        run: mvn test

      - name: Success Message
        run: echo "Spring Boot CI Pipeline Completed!"
