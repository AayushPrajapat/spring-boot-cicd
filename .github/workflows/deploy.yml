
name: Spring Boot CI CD Pipeline using GitHub Actions.

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Step 1: Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Check Java Version
      - name: Check Java Version
        run: java -version

      # Step 4: Build Project
      - name: Build Project
        run: mvn clean install

      # Step 5: Run Tests
      - name: Run Tests
        run: mvn test

      # Step 6: Build Docker Image
      - name: Build Docker Image
        run: docker build -t spring-boot-cicd .

      # Step 7: Login to Docker Hub
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 8: Tag Docker Image
      - name: Tag Docker Image
        if: github.event_name != 'pull_request'
        run: docker tag spring-boot-cicd:latest ${{ secrets.DOCKER_USERNAME }}/spring-boot-cicd:latest

      # Step 9: Push Docker Image
      - name: Push Docker Image
        if: github.event_name != 'pull_request'
        run: docker push ${{ secrets.DOCKER_USERNAME }}/spring-boot-cicd:latest

      # Step 10: Success Message
      - name: Success Message
        run: echo "Spring Boot CI CD Pipeline Completed!"
